name: Update profile cards

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

env:
  # Shared card options; only the colors differ per theme.
  # Both cards render at 400x190 so they line up side by side and when stacked:
  #   top-langs compact height = 90 + round(langs_count / 2) * 25       -> 8 langs = 190
  #   stats height             = 45 + (rows + 1) * line_height           -> 4 rows, 29 = 190
  LANG_OPTIONS: "layout=compact&langs_count=8&size_weight=0.5&count_weight=0.5&hide=html,css,jupyter%20notebook&card_width=400"
  STATS_OPTIONS: "show_icons=true&include_all_commits=true&count_private=true&hide_rank=true&hide=contribs&line_height=29&card_width=400"
  COMMON_OPTIONS: "border_radius=6"
  # GitHub Primer colors: bgColor-default, fgColor-default, fgColor-muted, borderColor-default.
  DARK: "bg_color=0d1117&title_color=f0f6fc&text_color=f0f6fc&icon_color=9198a1&border_color=3d444d"
  LIGHT: "bg_color=ffffff&title_color=1f2328&text_color=1f2328&icon_color=59636e&border_color=d1d9e0"
  CORE_VERSION: "2.2.0"

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Top languages (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "${{ env.LANG_OPTIONS }}&${{ env.COMMON_OPTIONS }}&${{ env.DARK }}"
          path: profile/top-langs-dark.svg
          token: ${{ secrets.PROFILE_CARDS_TOKEN }}
          core_version: ${{ env.CORE_VERSION }}
          fail_on_error: true

      - name: Top languages (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "${{ env.LANG_OPTIONS }}&${{ env.COMMON_OPTIONS }}&${{ env.LIGHT }}"
          path: profile/top-langs-light.svg
          token: ${{ secrets.PROFILE_CARDS_TOKEN }}
          core_version: ${{ env.CORE_VERSION }}
          fail_on_error: true

      - name: Stats (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "${{ env.STATS_OPTIONS }}&${{ env.COMMON_OPTIONS }}&${{ env.DARK }}"
          path: profile/stats-dark.svg
          token: ${{ secrets.PROFILE_CARDS_TOKEN }}
          core_version: ${{ env.CORE_VERSION }}
          fail_on_error: true

      - name: Stats (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "${{ env.STATS_OPTIONS }}&${{ env.COMMON_OPTIONS }}&${{ env.LIGHT }}"
          path: profile/stats-light.svg
          token: ${{ secrets.PROFILE_CARDS_TOKEN }}
          core_version: ${{ env.CORE_VERSION }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          git diff --cached --quiet && exit 0
          git commit -m "Update profile cards"
          git push
